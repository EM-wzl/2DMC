<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>跳跃与生物视觉验证</title>
<style>html,body{margin:0;padding:0;overflow:hidden;background:#000}iframe{border:0;display:block;width:100vw;height:100vh}</style>
</head>
<body>
<iframe id="fr" src="../index.html"></iframe>
<script>
const wait = ms => new Promise(r => setTimeout(r, ms));
document.getElementById('fr').addEventListener('load', async () => {
  const fr = document.getElementById('fr');
  const w = fr.contentWindow, d = fr.contentDocument;
  await wait(900);
  const b = d.getElementById('btn-new'); if (b) b.click();
  await wait(1200);                       // 让真实渲染循环先画出首屏
  const g = w.game, E = w.DMC.Entities, p = g.player;
  p.creative = true; p.fly = false;
  const zero = { left: 0, right: 0, jump: 0, up: 0, down: 0 };
  // 只手动推进物理，不碰 rAF / renderer，保证浏览器正常合成画面
  for (let i = 0; i < 120; i++) p.update(g.world, zero);
  const types = ['zombie', 'skeleton', 'creeper', 'sheep', 'spider'];
  types.forEach((t, i) => {
    const def = E.MOB_DEFS[t];
    const x = Math.floor(p.x) - 9 + i * 4 + 0.5;
    const y = E.Physics.findSpawn(g.world, x, p.y, def.w, def.h);
    if (y !== null) g.mobs.push(new E.Mob(t, x, y));
  });
  for (let f = 0; f < 90; f++)
    for (const m of g.mobs) m.update(g.world, p, { explode() {} });
  for (let i = 0; i < 7; i++)            // 点按跳起 7 帧
    p.update(g.world, Object.assign({}, zero, { jump: i === 0 ? 1 : 0 }));
  g.renderer.render(g);                  // 同步重绘最终画面
  await wait(400);
  document.title = 'mobs=' + g.mobs.length + ' air=' + (!p.onGround);
});
</script>
</body>
</html>
