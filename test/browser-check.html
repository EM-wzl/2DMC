<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>2DMC Web 浏览器加载自检</title></head>
<body>
<div id="result">PENDING</div>
<iframe id="fr" src="../index.html" style="width:1000px;height:640px;border:0"></iframe>
<script>
(function () {
  const out = [];
  const fr = document.getElementById('fr');
  window.addEventListener('error', e => out.push('window_error=' + e.message));
  fr.addEventListener('load', () => {
    setTimeout(() => {
      try {
        const w = fr.contentWindow;
        out.push('DMC=' + !!w.DMC);
        out.push('game=' + !!w.game);
        out.push('modules=' + Object.keys(w.DMC || {}).sort().join(','));
        const r = w.DMC.SelfTest.run();
        out.push('selftest=' + r.passed + '/' + (r.passed + r.failed));
        r.lines.filter(l => l.startsWith('FAIL')).forEach(l => out.push('fail=' + l.slice(5)));
        const t = w.document.querySelector('#toast');
        out.push('startup=' + (t && /启动失败/.test(t.textContent) ? 'FAILED:' + t.textContent : 'OK'));
        out.push('canvas=' + (w.document.querySelector('#game').width > 0));
        out.push('world=' + (w.game ? w.game.world.dim + ':' + w.game.world.seed : 'none'));
        out.push('dragon=' + (w.game && w.game.dragon ? w.game.dragon.segs.length : 0));
        if (w.game && w.game.textures) {
          const tp = w.game.textures;
          out.push('textures=' + (tp.total - tp.failed) + '/' + tp.total);
          out.push('stone_tex=' + !!tp.get(1));
          out.push('grass_tex=' + !!tp.get(2));
          out.push('diamond_sword_tex=' + !!tp.get(w.DMC.I.DIAMOND_SWORD));
          try {
            const kd = k => w.document.dispatchEvent(
              new w.KeyboardEvent('keydown', { key: k, bubbles: true }));
            kd('t');
            out.push('t_off=' + (tp.enabled === false));
            kd('t');
            out.push('t_on=' + (tp.enabled === true));
          } catch (e) { out.push('t_toggle_err=' + e.message); }
        }
        if (w.game && w.game.sprites) {
          const sp = w.game.sprites;
          out.push('sprites=' + (sp.total - sp.failed) + '/' + sp.total);
          out.push('player_sprite=' + !!sp.getPlayer());
          out.push('zombie_sprite=' + !!sp.getMob('zombie'));
          out.push('creeper_sprite=' + !!sp.getMob('creeper'));
        }
        // 配方书：真实点击「可做」一行，检查是否自动摆料并得到产物
        try {
          w.game.ui.openPanel('inv');
          const rows = w.document.querySelectorAll('.recipe-row.ok');
          out.push('recipe_ok_rows=' + rows.length);
          if (rows.length) {
            rows[0].click();
            const res = w.game.craft.result();
            out.push('quick_craft_filled=' + w.game.craft.cells.some(v => v > 0));
            out.push('quick_craft_result=' + (res ? w.DMC.DEF[res.out].cn : 'none'));
          }
          w.game.ui.closePanel();
        } catch (e) { out.push('recipe_err=' + e.message); }
      } catch (e) { out.push('EXCEPTION=' + e.message); }
      document.getElementById('result').textContent = out.join(' | ');
    }, 2200);
  });
})();
</script>
</body>
</html>
